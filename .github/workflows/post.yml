name: Post deals

on:
  schedule:
    # GitHub delays cron runs a lot, so each run stays alive and checks every 30 seconds.
    # A new run only waits in the queue while the previous one is still working.
    - cron: "*/20 9-22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "tick = follow the schedule, now = post the next deal now (09:00-23:30 only), test = post the next deal now at any hour"
        default: tick
        type: choice
        options: [tick, now, test]

permissions:
  contents: write

concurrency:
  group: post-deals
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests tzdata pillow
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          MODE: ${{ inputs.mode || 'tick' }}
        run: |
          git config user.name "angebote3-bot"
          git config user.email "angebote3-bot@users.noreply.github.com"
          save_state() {
            git add state/posted.json
            git diff --cached --quiet || { git commit -q -m "Update posted state"; git pull -q --rebase && git push -q; }
          }
          if [ "$MODE" != "tick" ]; then
            python publisher.py "$MODE"; status=$?; save_state; exit $status
          fi
          end=$((SECONDS + 20400))  # about 5h40m, under the 6h job limit
          while [ $SECONDS -lt $end ]; do
            hm=$(TZ=Europe/Berlin date +%H%M)
            if [ "$hm" -gt 2331 ] || [ "$hm" -lt 0850 ]; then echo "خارج ساعات النشر"; break; fi
            git pull -q --rebase || true
            python publisher.py tick | grep -v "ليس موعد نشر الآن" || true
            save_state
            sleep 30
          done
